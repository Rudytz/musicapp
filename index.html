<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bassline</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav">
  <h1>Bassline</h1>
  <button data-view="library" class="on">Library</button>
  <button data-view="moods">Moods</button>
  <button data-view="playlist">My playlist</button>
  <button data-view="quiz">Quiz</button>
  <button data-view="viz">Visualizer</button>
  <button data-view="timeline">Pop timeline</button>
</nav>

<main>
  <section id="library" class="view on">
    <h2>Library</h2>
    <ul class="songs" id="libList"></ul>
  </section>

  <section id="moods" class="view">
    <h2>How are you feeling?</h2>
    <div id="moodBtns"></div>
    <ul class="songs" id="moodList"></ul>
  </section>

  <section id="playlist" class="view">
    <h2>My playlist</h2>
    <p id="emptyMsg">Nothing here yet. Press + next to a song in the Library to add it.</p>
    <ul class="songs" id="plList"></ul>
  </section>

  <section id="quiz" class="view">
    <h2>Music quiz</h2>
    <div id="quizBox"></div>
  </section>

  <section id="viz" class="view">
    <h2>Visualizer</h2>
    <p>Press play on any song and watch it move.</p>
    <canvas id="cv" width="800" height="320"></canvas>
  </section>

  <section id="timeline" class="view">
    <h2>Pop music through the decades</h2>
    <ol id="tl"></ol>
  </section>
</main>

<footer id="bar">
  <div id="now"><strong id="nowTitle">Pick a song</strong><span id="nowArtist"></span></div>
  <div id="ctrl">
    <button id="prev" aria-label="Previous song">⏮</button>
    <button id="play" aria-label="Play">▶</button>
    <button id="next" aria-label="Next song">⏭</button>
  </div>
  <input type="range" id="seek" min="0" max="100" value="0" aria-label="Song progress">
  <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
  <audio id="audio"></audio>
</footer>

<script src="script.js"></script>
</body>
</html>
